<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mediaplayer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231a1b26%27/%3E%3Cpath d=%27M12 9l12 7-12 7z%27 fill=%27%237aa2f7%27/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/tokyo-night.css" />
    <link rel="stylesheet" href="/css/browser.css" />
  </head>
  <body data-view="browser">
    <div id="app">
      <main class="grid" id="grid">
        <div class="col-head col-head-mount" id="head-mount">Mount</div>
        <div class="col-head col-head-files" id="head-files">
          <div class="crumbs" id="crumbs"></div>
          <!-- Used space on the configured disk. Hidden until /api/disk
               returns a usable number (unset config, unmounted device, …). -->
          <div class="disk" id="disk" hidden>
            <span class="disk-ic" id="disk-ic"></span>
            <span class="disk-bar"
              ><span class="disk-fill" id="disk-fill"></span
            ></span>
            <span class="disk-pct" id="disk-pct"></span>
          </div>
          <div class="filter" id="filter" hidden>
            <input id="filter-input" type="text" placeholder="filter…" />
          </div>
        </div>

        <section class="col mounts" id="col-mounts">
          <ul id="mount-list" class="list" tabindex="0"></ul>
        </section>

        <section class="col files" id="col-files">
          <ul id="file-list" class="list" tabindex="0"></ul>
        </section>

        <section class="col preview" id="col-preview">
          <div class="preview-body">
            <img id="preview-img" alt="" />
            <div id="preview-meta" class="meta"></div>
          </div>
        </section>
      </main>

      <div class="mobile-nav-wrap" id="mobile-nav-wrap">
        <button
          class="mobile-nav-toggle"
          id="mobile-nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="mobile-nav"
          title="toggle nav"
        >
          ☰
        </button>
        <nav class="mobile-nav" id="mobile-nav" hidden>
          <button data-act="up" title="up">▲</button>
          <button data-act="down" title="down">▼</button>
          <button data-act="enter" title="open">▶</button>
          <span class="sep"></span>
          <button data-act="sort" title="sort">⇅</button>
          <button data-act="filter" title="filter">⌕</button>
          <button data-act="rename" title="rename">✎</button>
          <button data-act="unpart" title="strip .part">✂</button>
          <button data-act="sheet" title="thumbnail sheet">▦</button>
          <button data-act="delete" title="delete">✖</button>
        </nav>
      </div>

      <footer class="statusbar" id="statusbar"></footer>
    </div>

    <!-- Thumbnail sheet: capped at 80% of the viewport, tiles are sized in JS
         so the whole grid fits without scrolling. Closes on any input. -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" id="sheet-card">
        <div class="sheet-head" id="sheet-head"></div>
        <div class="sheet-grid" id="sheet-grid"></div>
      </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <div class="modal-head" id="modal-title"></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot">
          <button id="modal-ok"></button>
          <button id="modal-cancel"></button>
        </div>
      </div>
    </div>

    <!-- api.js stays a classic script: it defines the window globals both pages
         share, and the player page has no module tree. browser.js is the entry
         module — it pulls in dom/listing/sheet/dialogs/disk itself. -->
    <script src="/js/api.js"></script>
    <script type="module" src="/js/browser.js"></script>
  </body>
</html>
