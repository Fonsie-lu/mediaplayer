<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mediaplayer · play</title>
    <link rel="stylesheet" href="/css/tokyo-night.css" />
    <link rel="stylesheet" href="/css/player.css" />
  </head>
  <body data-view="player">
    <div id="player-root">
      <!-- The OSD and the help card live inside .stage because fullscreen is
           requested on .stage, and only the fullscreen element's subtree is
           rendered — anything outside it would vanish in fullscreen. -->
      <div class="stage" id="stage">
        <video id="video" playsinline controls></video>
        <div id="osd" class="osd" hidden aria-live="polite"></div>
        <div id="help" class="modal" hidden>
          <div class="modal-card">
            <div class="modal-head">Keyboard shortcuts</div>
            <div class="modal-body">
              <ul class="keys">
                <li>
                  <span><kbd>space</kbd></span
                  ><span class="desc">play / pause</span>
                </li>
                <li>
                  <span><kbd>h</kbd> <kbd>l</kbd></span>
                  <span class="desc">seek back / forward 5s</span>
                </li>
                <li>
                  <span><kbd>j</kbd> <kbd>k</kbd></span>
                  <span class="desc">seek back / forward 1 min</span>
                </li>
                <li>
                  <span><kbd>↑</kbd> <kbd>↓</kbd></span>
                  <span class="desc">volume ±10%</span>
                </li>
                <li>
                  <span><kbd>0</kbd>…<kbd>9</kbd></span>
                  <span class="desc">jump to 0–90% of the video</span>
                </li>
                <li>
                  <span><kbd>m</kbd></span
                  ><span class="desc">mute</span>
                </li>
                <li>
                  <span><kbd>f</kbd></span
                  ><span class="desc">fullscreen</span>
                </li>
                <li>
                  <span><kbd>q</kbd> <kbd>esc</kbd></span>
                  <span class="desc">close and go back</span>
                </li>
                <li>
                  <span><kbd>?</kbd></span
                  ><span class="desc">this help</span>
                </li>
              </ul>
            </div>
            <div class="modal-foot">
              <button id="help-close">close</button>
            </div>
          </div>
        </div>
      </div>
      <nav class="player-nav" id="player-nav">
        <label class="nav-item">
          <span class="nav-ic" aria-hidden="true">⚙</span>
          <select id="quality" aria-label="quality">
            <option value="auto">auto</option>
            <option value="source">source</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
          </select>
        </label>
        <label class="nav-item" id="audio-item" hidden>
          <span class="nav-ic" aria-hidden="true">🗣</span>
          <select id="audio" aria-label="audio track"></select>
        </label>
        <button id="mute" title="mute (m)" aria-label="mute">
          <span class="nav-ic">🔊</span>
        </button>
        <button
          id="help-btn"
          title="keyboard shortcuts (?)"
          aria-label="shortcuts"
        >
          <span class="nav-ic">?</span>
        </button>
        <button id="close" title="close (q or Esc)" aria-label="close">
          <span class="nav-ic">✕</span>
        </button>
      </nav>
      <div id="status" class="status"></div>
    </div>

    <!-- hls.js for non-native HLS browsers (Chrome/Firefox). Optional; Safari has native HLS. -->
    <script
      src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"
      onerror="window.__hlsjsFailed = true"
    ></script>
    <script src="/js/api.js"></script>
    <script src="/js/player.js"></script>
  </body>
</html>
